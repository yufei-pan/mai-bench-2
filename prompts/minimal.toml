# A terse alternative template, shipped as a working example of --prompts.
# Copy this to make your own; runs carry prompts_hex so they stay distinguishable.
id = "minimal"

[planner]
system = """规划席。{bot_name} {behavior_style} {group_chat_attention_block} {query_memory_rule}"""
final_assistant_reminder = "提醒 {bot_name}"
final_user_reminder = "请 {bot_name} 分析"

[planner.query_memory_rule]
group = "- query_memory() 群聊记忆"
private = "- query_memory() 私聊记忆"

[replyer]
system = """{identity} {reply_style} {group_chat_attention_block} {replyer_output_instruction}"""
output_instruction = "只输出发言内容。"
final_instruction = "自然回复，只输出发言。"

[replyer.reply_style_message]
"简短表达" = "请简短回复"
"长回复" = "可以详细回复"
